<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Project Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
        }
        .card {
            border-radius: 16px;
            background: #111111;
            color: #ffffff;
            border: 1px solid #2a2a2a;
        }
        .btn {
            border-radius: 10px;
        }
        .text-secondary {
            color: #d0d0d0 !important;
        }
        .form-control,
        .form-select,
        .form-control:focus,
        .form-select:focus {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
            box-shadow: none;
        }
        .form-control::placeholder {
            color: #999999;
        }
        .alert-danger {
            background-color: #2a0d0d;
            color: #ffb4b4;
            border-color: #442222;
        }
        .navbar {
            background: #000000 !important;
            border-bottom: 1px solid #1f1f1f;
        }
        a {
            color: #ffffff;
        }
        a:hover {
            color: #d0d0d0;
        }
        .btn-primary {
            background-color: #ffffff;
            border-color: #ffffff;
            color: #000000;
        }
        .btn-primary:hover {
            background-color: #e6e6e6;
            border-color: #e6e6e6;
            color: #000000;
        }
        .btn-outline-light {
            color: #ffffff;
            border-color: #ffffff;
        }
        .btn-outline-light:hover {
            background-color: #ffffff;
            color: #000000;
        }
        .btn-outline-dark {
            color: #ffffff;
            border-color: #ffffff;
        }
        .btn-outline-dark:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>
    {% include 'master/nav.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
