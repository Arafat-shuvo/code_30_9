<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background: #000000; color: #ffffff;">
    <div class="card shadow-lg border-0" style="width: 100%; max-width: 420px; background: #111111; color: #ffffff; border: 1px solid #2a2a2a;">
        <div class="card-body p-4 p-md-5">
            <h2 class="text-center mb-4">Login</h2>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" style="color: #ffffff;">Username</label>
                    <input type="text" name="username" class="form-control" required style="background: #1a1a1a; color: #ffffff; border: 1px solid #333333;">
                </div>

                <div class="mb-3">
                    <label class="form-label" style="color: #ffffff;">Password</label>
                    <input type="password" name="password" class="form-control" required style="background: #1a1a1a; color: #ffffff; border: 1px solid #333333;">
                </div>

                <button type="submit" class="btn btn-primary w-100" style="background: #ffffff; color: #000000; border-color: #ffffff;">Login</button>
            </form>

            <p class="text-center mt-3 mb-0" style="color: #d0d0d0;">
                Don't have an account?
                <a href="{% url 'register' %}" style="color: #ffffff;">Register</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
